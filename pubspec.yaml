name: openchroma
description: "Open RGB lighting, fan control and PC monitoring for Windows."
publish_to: "none"
version: 0.9.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  crypto: ^3.0.8
  ffi: ^2.2.0
  flutter_js: ^0.8.7
  webview_windows: ^0.4.0
  path: ^1.9.1
  path_provider: ^2.1.6
  file_selector: ^1.1.0
  image: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/effects/
    - assets/plugins/
    - assets/pawnio/
