version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build(ci)
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build(deps)
    open-pull-requests-limit: 5
