name: Feature request
description: Suggest an idea or an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the ROADMAP.md and existing issues first; maybe it's already planned.
        For open-ended ideas, consider starting a discussion instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches or apps that do something similar.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to help implement this.
